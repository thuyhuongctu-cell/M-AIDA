# M-AIDA production — single host, HTTPS + HTTP Basic auth via Caddy.
# Use this INSTEAD OF docker-compose.prod.yml when exposing to the internet:
# only Caddy is published (80/443); frontend and backend stay on the internal
# network. Basic auth (deploy/Caddyfile) is the primary fix for S1.
#
#   cp backend/.env.production.example backend/.env     # then set MAIDA_API_KEY + LLM_API_KEY
#   edit deploy/Caddyfile   (your domain + password hash)
#   docker compose -f docker-compose.prod.caddy.yml up -d --build

services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    restart: unless-stopped
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8765/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    expose:
      - "3000"                       # internal only now (Caddy fronts it)
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
