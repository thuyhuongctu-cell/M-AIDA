name: CI

on:
  push:
    branches: [main, 'dev/**', 'fix/**', 'feat/**', 'chore/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest ruff
      - name: Lint (syntax errors and undefined names)
        run: ruff check backend demo validation --select E9,F
      - name: Unit tests
        working-directory: backend
        run: pytest tests -q
      - name: Defense App smoke test
        run: python demo/smoke_test.py
      - name: Independent-validation analysis tests
        run: python -m pytest validation/tests -q
      - name: Public-site research metrics guard
        run: python scripts/check_site_metrics.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check
        working-directory: frontend
        run: npm run typecheck
      - name: Mobile release-gate tests
        working-directory: frontend
        run: npm run test:mobile
      - name: Mobile project check
        working-directory: frontend
        run: npm run mobile:check
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Sync native web assets
        working-directory: frontend
        run: npx cap sync --deployment
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build Android debug package
        working-directory: frontend/android
        run: ./gradlew assembleDebug
